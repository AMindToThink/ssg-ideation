[project]
name = "ssg-ideation"
version = "0.1.0"
description = "Test whether frontier models independently come up with Social Sanction Gaming"
readme = "README.md"
authors = [
    { name = "AMindToThink", email = "AMindToThink@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
